@if ({ isLoginValid: (isLoginValid$ | async) }; as data) {
  <mat-card class="login-form">
    <mat-card-header>
      <mat-card-title>Login</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field class="full-width">
          <input matInput placeholder="Email" formControlName="email" required>
          @if (!data.isLoginValid) {
            <mat-error>Data is invalid</mat-error>
          } @else if (loginForm.get('email')?.invalid) {
            <mat-error>Please enter a valid email</mat-error>
          }
        </mat-form-field>

        <mat-form-field class="full-width">
          <input matInput placeholder="Password" formControlName="password" required>
          @if (loginForm.get('password')?.invalid) {
            <mat-error>Password isn't valid</mat-error>
          }
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="loginForm.invalid"
        >Login</button>
      </form>
    </mat-card-content>
  </mat-card>
}
